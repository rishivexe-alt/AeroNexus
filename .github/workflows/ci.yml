name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Python syntax check
        run: python -m py_compile $(git ls-files '*.py')

      - name: Shell syntax check
        run: |
          for f in $(git ls-files '*.sh' '*.bash'); do
            bash -n "$f"
          done

      - name: Validate configuration files
        run: |
          pip install pyyaml
          python -c "import xml.dom.minidom as m; m.parse('config/fastdds_udp_only.xml')"
          python -c "import yaml; yaml.safe_load(open('config/world_swarm_5drone.yaml'))"

      - name: Election unit tests
        run: python test_election.py
